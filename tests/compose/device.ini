# Disposable manual lab configuration; never deploy this shared test secret.
[wtctl]
format=1
url=https://sources:8443/manager
wstunnel_url=https://sources:8443/binary
storage=ram

[control]
enabled=true
server=primary
bind=0.0.0.0
listen=8099

[server primary]
endpoint=wss://wstunnel:8080
auth=path
prefix=test-secret-prefix
ca=/lab/ca.pem

[tunnel echo]
server=primary
direction=forward
protocol=tcp
bind=0.0.0.0
listen=2222
target=server-target
port=17080
